# Ụgwọ — nginx server block
# Place this file at /etc/nginx/sites-available/ugwo
# Then: sudo ln -s /etc/nginx/sites-available/ugwo /etc/nginx/sites-enabled/ugwo
# And : sudo nginx -t && sudo systemctl reload nginx
#
# TLS: after the DNS A record for ugwo.nippysky.com points at the droplet, run
#   sudo certbot --nginx -d ugwo.nippysky.com
# Certbot rewrites this file with the ssl directives (same as aku).

server {
    listen 80;
    server_name ugwo.nippysky.com;

    # ── Proxy all /api/* traffic to the Node server (port 3001) ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade — /api/sync/ws real-time sync
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;

        # Timeouts (long read timeout keeps idle WebSockets alive;
        # the client pings every 25 s)
        proxy_connect_timeout 10s;
        proxy_read_timeout    75s;
    }

    # ── Health check (no auth needed) ──
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
    }

    # ── Ụgwọ static website (landing + legal pages) ──
    # Clean URLs: /privacy → privacy.html, /terms → terms.html,
    #             /delete-account → delete-account.html
    # Store-listing URLs (Apple + Google):
    #   Privacy policy:   https://ugwo.nippysky.com/privacy
    #   Account deletion: https://ugwo.nippysky.com/delete-account
    location / {
        root /var/www/ugwo-api/public;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
